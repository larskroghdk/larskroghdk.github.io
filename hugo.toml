# Hugo site configuration: https://gohugo.io/configuration/
# PaperMod parameters:   https://github.com/adityatelange/hugo-PaperMod/wiki/Variables
#
# baseURL is overridden in CI with the URL reported by GitHub Pages, so the
# same build works for <user>.github.io, project sites and custom domains.
baseURL = "https://larskroghdk.github.io/"
locale = "en-US"
title = "Lars Krogh"
copyright = "© Lars Krogh Paulsen"
timeZone = "Europe/Copenhagen"

enableRobotsTXT = true
enableGitInfo = true            # .Lastmod from git history (used by the sitemap and post meta)
refLinksErrorLevel = "error"    # a broken ref/relref fails the build

[module]
  [module.hugoVersion]
    extended = true
    min = "0.158.0"             # PaperMod's documented minimum
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[pagination]
  pagerSize = 10

[outputs]
  home = ["html", "rss", "json"]  # json feeds the Fuse.js search index (index.json)

[frontmatter]
  lastmod = [":git", "lastmod", ":fileModTime", ":default"]

[markup]
  [markup.highlight]
    noClasses = false           # PaperMod ships its own Chroma stylesheet
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "Notes on infrastructure, automation and software engineering."
  author = "Lars Krogh Paulsen"
  defaultTheme = "auto"         # follow the OS light/dark preference; the toggle overrides it
  mainSections = ["posts"]
  DateFormat = "2 January 2006"

  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  ShowRssButtonInSectionTermList = true

  [params.editPost]
    URL = "https://github.com/larskroghdk/larskroghdk.github.io/blob/main/content"
    Text = "Suggest changes"
    appendFilePath = true

  [params.homeInfoParams]
    Title = "Hi, I'm Lars Krogh"
    Content = "I write about infrastructure as code, automation, PowerShell, and Go—sharing practical insights, real-world experiences, and open-source projects focused on building smarter, more reliable infrastructure."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/larskroghdk"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "Archive"
    pageRef = "/archives"
    weight = 20
  [[menus.main]]
    name = "Categories"
    pageRef = "/categories"
    weight = 30
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 40
  [[menus.main]]
    name = "Search"
    pageRef = "/search"
    weight = 50
