name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && 'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

env:
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      HUGO_ENVIRONMENT: production
      TZ: Europe/Copenhagen
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pinned Hugo version
        run: |
          grep -E '^[A-Z0-9_]+=' .github/hugo-version.env >> "$GITHUB_ENV"
          echo "HUGO_CACHEDIR=${RUNNER_TEMP}/hugo_cache" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"

      - name: Restore Hugo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('.github/hugo-version.env', 'go.sum') }}
          restore-keys: |
            hugo-${{ runner.os }}-

      - name: Verify Hugo modules
        run: |
          hugo version
          hugo mod verify

      - name: Configure GitHub Pages
        id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo build --gc --minify --panicOnWarning --printPathWarnings --printI18nWarnings \
            ${BASE_URL:+--baseURL "${BASE_URL}/"}

      - name: Check internal links
        run: |
          hugo build --gc --baseURL / --destination public-linkcheck --quiet
          go run github.com/wjdp/htmltest@v0.17.0

      - name: Upload Pages artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    name: Deploy
    needs: [lint, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
